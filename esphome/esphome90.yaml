# Device specific substitutions
substitutions:
  node_id: "90"
  node_name: esphome90
  node_friendly_name: Salt (verkstan)
  node_comment: Esp32 D1 mini (VLAN IoT)
  log_level: DEBUG

# Include packages for this device specific type
packages:
  device: !include common/.board_d1_mini32.yaml

i2c:
  sda: 17
  scl: 16
  scan: true
  
sensor:
  - platform: vl53l0x
    name: "${node_name} Salt level"
    id: myVL53L0x
    address: 0x29
    update_interval: 60s
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    filters:
      - filter_out: nan
      # Full saltbehållare = 0.087
      - sliding_window_moving_average:
          window_size: 8
          send_every: 1
          send_first_at: 1
      - calibrate_linear:
          - 0.08 -> 100
          - 0.400 -> 0
      - clamp:
          min_value: 0
          max_value: 100

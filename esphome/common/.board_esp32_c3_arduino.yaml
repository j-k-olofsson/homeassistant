# Root file for ESP32-C3 (Arduino framework)

# Node info
esphome:
  name: ${node_name}
  comment: ${node_comment}
  friendly_name: ${node_friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  framework:
    type: arduino
    version: recommended

packages:
  device_base: !include .base.yaml

switch:
  - platform: restart
    id: myRestartSwitch
    internal: true

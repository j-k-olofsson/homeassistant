# Shared package for the VEML6075 UVA/UVB sensor

external_components:
  - source:
      type: local
      path: custom_components
    components: [veml6075_custom]

i2c:
  - id: veml6075_bus
    sda: ${veml6075_sda_pin}
    scl: ${veml6075_scl_pin}
    frequency: 100kHz
    scan: true

sensor:
  - platform: veml6075_custom
    i2c_id: veml6075_bus
    update_interval: ${uv_update_interval}
    uva:
      name: ${node_name} UVA
    uvb:
      name: ${node_name} UVB
    uvi:
      name: ${node_name} UVI

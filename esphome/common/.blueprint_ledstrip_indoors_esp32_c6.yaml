packages:
  ledstrip: !include .base_ledstrip_indoors_esp32_c6.yaml

text_sensor:
  - platform: homeassistant
    id: myLightScen
    entity_id: input_select.light_scene
    internal: true
    on_value:
      then:
        - script.execute: apply_scene

script:
  - id: apply_scene
    mode: restart
    then:
      - if:
          condition:
            or:
              - text_sensor.state: { id: myLightScen, state: "DAY" }
              - text_sensor.state: { id: myLightScen, state: "DAWN" }
              - text_sensor.state: { id: myLightScen, state: "DUSK" }
          then:
            - light.turn_on:
                id: myLED
                effect: none
            - light.turn_on:
                id: myLED
                brightness: ${day_brightness}
                red: 80%
                green: 70%
                blue: 30%
      - if:
          condition:
            text_sensor.state: { id: myLightScen, state: "NIGHT" }
          then:
            - light.turn_on:
                id: myLED
                effect: none
            - light.turn_on:
                id: myLED
                brightness: ${night_brightness}
                red: 100%
                green: 0%
                blue: 0%
      - if:
          condition:
            text_sensor.state: { id: myLightScen, state: "XMAS" }
          then:
            - light.turn_on:
                id: myLED
                brightness: 100%
                effect: xmas
      - if:
          condition:
            text_sensor.state: { id: myLightScen, state: "ALARM" }
          then:
            - light.turn_on:
                id: myLED
                brightness: 100%
                effect: alarm
      - if:
          condition:
            text_sensor.state: { id: myLightScen, state: "PARTY" }
          then:
            - light.turn_on:
                id: myLED
                brightness: 100%
                effect: party

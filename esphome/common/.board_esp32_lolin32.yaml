# Root file for ESP32 Lolin32 specific stuff

# Node info
esphome:
  name: ${node_name}
  comment: ${node_comment}
  friendly_name: ${node_friendly_name}

esp32:
  board: lolin32
  framework:
    type: arduino
    version: recommended
    advanced:
      sram1_as_iram: true
# [14:37:38.102][W][app:198]: Bootloader supports SRAM1 as IRAM (+40KB). Set sram1_as_iram: true under esp32 > framework > advanced

packages:
  device_base: !include .base.yaml

switch:
  - platform: restart
    internal: true
    id: myRestartSwitch
    

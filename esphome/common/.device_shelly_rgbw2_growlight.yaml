# Device type specific file for Shelly RGBW2 growlight controller

esphome:
  name: ${node_name}
  comment: ${node_comment}
  friendly_name: ${node_friendly_name}

esp8266:
  board: esp01_1m
  framework:
    version: recommended

packages:
  device_base: !include .base.yaml
  growlight_logic: !include .blueprint_growlight_sunrise.yaml

logger:
  baud_rate: 0

status_led:
  pin:
    number: GPIO2
    inverted: true

output:
  # Shelly RGBW2 channel mapping (R,G,B,W)
  - platform: esp8266_pwm
    id: pwm_red
    pin: GPIO12
    frequency: 1000 Hz
  - platform: esp8266_pwm
    id: pwm_green
    pin: GPIO15
    frequency: 1000 Hz
  - platform: esp8266_pwm
    id: pwm_blue
    pin: GPIO14
    frequency: 1000 Hz
  - platform: esp8266_pwm
    id: pwm_white
    pin: GPIO4
    frequency: 1000 Hz

light:
  - platform: rgbw
    id: ${growlight_light_id}
    name: ${node_name} Growlight
    red: pwm_red
    green: pwm_green
    blue: pwm_blue
    white: pwm_white
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 1s
    gamma_correct: 1.0

switch:
  - platform: restart
    id: growlight_restart
    internal: true

# Root file for alla devices, only to be included by device specific package-files
# Requires the following substitutions:
#   - node_id
#   - log_level

# Enable WIFI
wifi:
  ssid: !secret IOT_SSID
  password: !secret IOT_PWD
  fast_connect: false
  power_save_mode: none
  min_auth_mode: WPA2
  domain: .local
  manual_ip:
    static_ip: 192.168.30.1${node_id}
    gateway: 192.168.30.1
    subnet: 255.255.255.0

# Enable logging, disableing consol log
logger:
  level: ${log_level}

# Enable web server
web_server:
  port: 80
  include_internal: true
  version: 2

# Enable Home Assistant API
api:
  encryption:
    key: !secret ENCRYPTION_KEY

# Enable OTA
ota:
  - platform: esphome
    password: !secret OTA_PWD

text_sensor:
  - platform: version
    internal: True
    name: ESPHome version
    hide_timestamp: True

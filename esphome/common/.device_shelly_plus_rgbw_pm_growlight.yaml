# Device type specific file for Shelly Plus RGBW PM growlight controller

esphome:
  name: ${node_name}
  comment: ${node_comment}
  friendly_name: ${node_friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

packages:
  device_base: !include .base.yaml
  growlight_logic: !include .blueprint_growlight_sunrise.yaml

status_led:
  pin: GPIO14

switch:
  - platform: restart
    id: growlight_restart
    internal: true

output:
  - platform: ledc
    pin: GPIO25
    id: pwm_r
    frequency: 19531
  - platform: ledc
    pin: GPIO27
    id: pwm_g
    frequency: 19531
  - platform: ledc
    pin: GPIO26
    id: pwm_b
    frequency: 19531
  - platform: ledc
    pin: GPIO4
    id: pwm_w
    frequency: 19531

light:
  - platform: rgbw
    id: ${growlight_light_id}
    name: ${node_name} Growlight
    red: pwm_r
    green: pwm_g
    blue: pwm_b
    white: pwm_w
    gamma_correct: 1.0
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 1s

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO36
      inverted: true
    name: ${node_name} Input 1
    internal: false
    filters:
      - delayed_on_off: 10ms
  - platform: gpio
    pin:
      number: GPIO37
      inverted: true
    name: ${node_name} Input 2
    internal: false
    filters:
      - delayed_on_off: 10ms
  - platform: gpio
    pin:
      number: GPIO38
      inverted: true
    name: ${node_name} Input 3
    internal: false
    filters:
      - delayed_on_off: 10ms
  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
    name: ${node_name} Input 4
    internal: false
    filters:
      - delayed_on_off: 10ms
  - platform: gpio
    pin: GPIO22
    name: ${node_name} Onboard Button
    internal: true
    filters:
      - delayed_on_off: 10ms

sensor:
  - platform: adc
    pin: GPIO33
    id: temp_analog_reading
    attenuation: 12db
  - platform: resistance
    sensor: temp_analog_reading
    id: temp_resistance_reading
    configuration: DOWNSTREAM
    resistor: 10kOhm
  - platform: ntc
    sensor: temp_resistance_reading
    name: ${node_name} Temperature
    calibration:
      b_constant: 3350
      reference_resistance: 10kOhm
      reference_temperature: 298.15K
  - platform: adc
    pin: GPIO34
    attenuation: 12db
    id: growlight_voltage
    name: ${node_name} Voltage
    accuracy_decimals: 1
    filters:
      - multiply: 10.85
  - platform: adc
    pin: GPIO35
    attenuation: 12db
    id: growlight_current
    name: ${node_name} Current
    accuracy_decimals: 2
    filters:
      - offset: -0.794
      - multiply: 16.13
    unit_of_measurement: A
  - platform: template
    name: ${node_name} Power
    id: growlight_power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      if (isnan(id(growlight_voltage).state) || isnan(id(growlight_current).state)) {
        return NAN;
      }
      return id(growlight_voltage).state * id(growlight_current).state;
  - platform: integration
    name: ${node_name} Energy
    sensor: growlight_power
    time_unit: h
    unit_of_measurement: Wh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 2

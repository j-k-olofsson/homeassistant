# Root file for M5Stack ATOM Lite specific stuff

# Node info
esphome:
  name: ${node_name}
  comment: ${node_comment}
  friendly_name: ${node_friendly_name}

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf
    version: recommended
    advanced:
      sram1_as_iram: true

packages:
  device_base: !include .base.yaml

switch:
  - platform: restart
    id: myRestartSwitch
    internal: true

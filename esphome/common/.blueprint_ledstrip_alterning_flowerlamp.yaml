packages:
  ledstrip: !include .base_ledstrip.yaml

# ------------------ SCENE-INPUT FRÅN HA ------------------
text_sensor:
  - platform: homeassistant
    # Possible scene values are "DAY", "DAWN", "DUSK", "NIGHT", "ALARM", "XMAS", "PARTY"
    id: myLightScen
    entity_id: input_select.light_scene
    internal: true
    on_value:
      then:
        - script.execute: apply_scene
  - platform: homeassistant
    # Possible scene values are "ON", "LATE_ON", "OFF"
    id: myGrowlightPhase
    entity_id: input_select.growlight_scene
    internal: true
    on_value:
      then:
        - script.execute: apply_scene

# ------------------ SCENLOGIK ------------------
script:
  - id: apply_scene
    mode: restart
    then:
      # DAY/DAWN/DUSK
      - if:
          condition:
            or:
              - text_sensor.state: { id: myLightScen, state: "DAY" }
              - text_sensor.state: { id: myLightScen, state: "DAWN" }
              - text_sensor.state: { id: myLightScen, state: "DUSK" }
          then:
            - if:
                condition:
                  or:
                  - text_sensor.state: { id: myGrowlightPhase, state: "ON" }
                  - text_sensor.state: { id: myGrowlightPhase, state: "LATE_ON" }
                then:
                  - light.turn_off:
                      id: myLED
                else:
                  - light.turn_on:
                      id: myLED
                      effect: none
                  - light.turn_on:
                      id: myLED
                      brightness: ${day_brightness}
                      red: 80%
                      green: 70%
                      blue: 30%
      # NIGHT
      - if:
          condition:
            text_sensor.state: { id: myLightScen, state: "NIGHT" }
          then:
            - light.turn_on:
                id: myLED
                effect: none
            - light.turn_on:
                id: myLED
                brightness: ${night_brightness}
                red: 100%
                green: 0%
                blue: 0%
      # XMAS
      - if:
          condition:
            text_sensor.state: { id: myLightScen, state: "XMAS" }
          then:
            - light.turn_on:
                id: myLED
                brightness: 100%
                effect: xmas
      # ALARM
      - if:
          condition:
            text_sensor.state: { id: myLightScen, state: "ALARM" }
          then:
            - light.turn_on:
                id: myLED
                brightness: 100%
                effect: alarm
      # PARTY
      - if:
          condition:
            text_sensor.state: { id: myLightScen, state: "PARTY" }
          then:
            - light.turn_on:
                id: myLED
                brightness: 100%
                effect: party

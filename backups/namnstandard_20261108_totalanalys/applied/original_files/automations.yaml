- id: '1769682852305'
  alias: "Hemmabio – bordslampor att/dag & bio av/på"
  description: Styr bordslamporna och prioriterar röd nattbelysning och bio framför adaptiv färgtemperatur.
  triggers:
  - entity_id: input_select.light_scene
    to: DAY
    id: scene_day
    trigger: state
  - entity_id: input_select.light_scene
    to: DAWN
    id: scene_dawn
    trigger: state
  - entity_id: input_select.light_scene
    to: DUSK
    id: scene_dusk
    trigger: state
  - entity_id: input_select.light_scene
    to: NIGHT
    id: scene_night
    trigger: state
  - entity_id: switch.grupp_hemmabio
    to: 'on'
    id: bio_on
    trigger: state
  - entity_id: switch.grupp_hemmabio
    to: 'off'
    id: bio_off
    trigger: state
  - event_type: test_bordslampor_bio_on
    id: bio_on
    trigger: event
  - event_type: test_bordslampor_bio_off
    id: bio_off
    trigger: event
  conditions: []
  actions:
  - action: switch.turn_off
    continue_on_error: true
    target:
      entity_id: switch.adaptive_lighting_bio
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''bio_on'' }}'
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.bion_bordslampa_vanster
          - light.bion_bordslampa_hoger
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''bio_off'' }}'
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: input_select.light_scene
            state: NIGHT
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.bion_bordslampa_vanster
              - light.bion_bordslampa_hoger
            data:
              rgb_color:
              - 255
              - 0
              - 0
              brightness_pct: 15
              transition: 1
        - conditions:
          - condition: state
            entity_id: input_select.light_scene
            state: DAY
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.bion_bordslampa_vanster
              - light.bion_bordslampa_hoger
            data:
              color_temp_kelvin: 3000
              brightness_pct: 25
              transition: 1
        - conditions:
          - condition: state
            entity_id: input_select.light_scene
            state: DAWN
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.bion_bordslampa_vanster
              - light.bion_bordslampa_hoger
            data:
              color_temp_kelvin: 3000
              brightness_pct: 25
              transition: 1
        - conditions:
          - condition: state
            entity_id: input_select.light_scene
            state: DUSK
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.bion_bordslampa_vanster
              - light.bion_bordslampa_hoger
            data:
              color_temp_kelvin: 3000
              brightness_pct: 25
              transition: 1
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''scene_day'',''scene_dawn'',''scene_dusk'',''scene_night'']
          and is_state(''switch.grupp_hemmabio'',''off'') }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ trigger.to_state is not none and trigger.from_state
              is not none and trigger.to_state.state == ''DAY'' and trigger.from_state.state
              == ''NIGHT'' }}'
          sequence:
          - variables:
              steps: 20
              start_brightness: 15
              end_brightness: 25
              start_rgb:
              - 255
              - 0
              - 0
              end_rgb:
              - 255
              - 214
              - 170
          - repeat:
              count: '{{ steps }}'
              sequence:
              - variables:
                  i: '{{ repeat.index }}'
                  t: '{{ (i - 1) / (steps - 1) }}'
                  r: '{{ (start_rgb[0] + (end_rgb[0] - start_rgb[0]) * t) | int }}'
                  g: '{{ (start_rgb[1] + (end_rgb[1] - start_rgb[1]) * t) | int }}'
                  b: '{{ (start_rgb[2] + (end_rgb[2] - start_rgb[2]) * t) | int }}'
                  bri: '{{ (start_brightness + (end_brightness - start_brightness)
                    * t) | int }}'
              - action: light.turn_on
                target:
                  entity_id:
                  - light.bion_bordslampa_vanster
                  - light.bion_bordslampa_hoger
                data:
                  rgb_color: '{{ [r, g, b] }}'
                  brightness_pct: '{{ bri }}'
                  transition: 30
              - delay: 00:00:30
          - action: light.turn_on
            target:
              entity_id:
              - light.bion_bordslampa_vanster
              - light.bion_bordslampa_hoger
            data:
              color_temp_kelvin: 3000
              brightness_pct: 25
              transition: 30
        - conditions:
          - condition: state
            entity_id: input_select.light_scene
            state: NIGHT
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.bion_bordslampa_vanster
              - light.bion_bordslampa_hoger
            data:
              rgb_color:
              - 255
              - 0
              - 0
              brightness_pct: 15
              transition: 1
        - conditions:
          - condition: state
            entity_id: input_select.light_scene
            state: DAY
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.bion_bordslampa_vanster
              - light.bion_bordslampa_hoger
            data:
              color_temp_kelvin: 3000
              brightness_pct: 25
              transition: 1
        - conditions:
          - condition: state
            entity_id: input_select.light_scene
            state: DAWN
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.bion_bordslampa_vanster
              - light.bion_bordslampa_hoger
            data:
              color_temp_kelvin: 3000
              brightness_pct: 25
              transition: 1
        - conditions:
          - condition: state
            entity_id: input_select.light_scene
            state: DUSK
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.bion_bordslampa_vanster
              - light.bion_bordslampa_hoger
            data:
              color_temp_kelvin: 3000
              brightness_pct: 25
              transition: 1
  - action: script.bio_adaptivt_ljus_synkronisera
    continue_on_error: true
  mode: restart

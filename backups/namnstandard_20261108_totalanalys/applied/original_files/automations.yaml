- id: '1669464348939'
  alias: Kontrollera växters välmående
  description: Meddela mobilen om växterna har för lite vatten eller för mycket näring.
  triggers:
  - at: 06:00:00
    trigger: time
  conditions:
  - condition: or
    conditions:
    - condition: state
      state: problem
      entity_id: plant.koket_paraplyaralia
    - condition: state
      entity_id: plant.verandan_doftpelargon
      state: problem
    - condition: state
      state: problem
      entity_id: plant.verandan_meyer_citron
    - condition: state
      state: problem
      entity_id: plant.verandan_fredskalla
    - condition: state
      state:
      - problem
      entity_id: plant.koket_fredskallor_trappan
    - condition: state
      state:
      - problem
      entity_id: plant.kontoret_monstera
  actions:
  - action: script.granny_broadcast
    metadata: {}
    data:
      severity: info
      humor_level: 0
      task: "{% from 'ha_namn.jinja' import namn %}\nMeddela att en eller flera av plantorna som beskrivs här behöver hjälp och vad det är för hjälp de behöver.\n{% for plant in states.plant if plant.state == 'problem' %}   {{- namn(plant.entity_id) }}:    {%- if 'Low' in plant.attributes.moisture_status %} Behöver vattnas.{% endif %}   {%- if 'High' in plant.attributes.moisture_status %} För mycket vatten!{% endif %}   {%- if 'Low' in plant.attributes.conductivity_status %} Behöver näring.{% endif %}   {%- if 'High' in plant.attributes.conductivity_status %} För mycket näring!{% endif %}   {% if loop.last %}{{ \"\\n\" }}{% endif %} {% endfor %}"
      channels:
      - mobile
      - ha
  mode: queued
  max: 10

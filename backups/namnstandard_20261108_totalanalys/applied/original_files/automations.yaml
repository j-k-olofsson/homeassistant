- id: '1751524387243'
  alias: "Billaddning – starta planering"
  description: Startar AI-planeringen av bilens laddning och överlåter schemaläggningen
    till skriptet granny_car_charge_plan.
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id:
    - sensor.nordpool
    attribute: tomorrow_valid
    to: 1
  - trigger: state
    entity_id:
    - device_tracker.utomhus_sef_42h_parkeringsplats
    to: home
    for:
      hours: 0
      minutes: 5
      seconds: 0
  - trigger: template
    value_template: "{{ states('sensor.utomhus_sef_42h_batteriniva') | float(999) <\n   states('input_number.malladdning')
      | float(999) }}\n"
    for:
      hours: 0
      minutes: 5
      seconds: 0
  - trigger: time_pattern
    minutes: /30
    id: periodic-replan
  conditions:
  - condition: template
    value_template: '{% set loc = states(''device_tracker.utomhus_sef_42h_parkeringsplats'')
      %} {{ loc in [''home'', ''Hemma''] }}

      '
  - condition: state
    entity_id: input_boolean.ai_planerad_billaddning
    state: 'on'
  - condition: state
    entity_id: input_boolean.manuell_laddstyrning
    state: 'off'
  - condition: template
    value_template: "{{ states('sensor.utomhus_sef_42h_batteriniva') | float(0) <\n   states('input_number.malladdning')
      | float(100) }}\n"
  - condition: state
    entity_id: input_boolean.home_assistant_redo
    state: 'on'
  actions:
  - variables:
      granny_notify_user: '{{ trigger.id | default('''') != ''periodic-replan'' }}'
      granny_window_end_iso: '{% set window_start = now() %} {% set deadline = today_at(''05:30:00'')
        %} {% set window_end = deadline if window_start < deadline else (deadline
        + timedelta(days=1)) %} {{ window_end.isoformat() }}'
      granny_tomorrow_valid: '{{ state_attr(''sensor.nordpool'', ''tomorrow_valid'')
        in [True, 1, ''true''] }}'
      granny_price_slots: "{% set sensor = 'sensor.nordpool' %} {% set raw_today =
        state_attr(sensor, 'raw_today') or [] %} {% set raw_tomorrow = state_attr(sensor,
        'raw_tomorrow') or [] %} {% set window_start = now() %} {% set deadline =
        today_at('05:30:00') %} {% set window_end = deadline if window_start < deadline
        else (deadline + timedelta(days=1)) %} {% set slots = namespace(count=0) %}
        {% for item in raw_today + raw_tomorrow %}\n  {% if item is mapping %}\n    {%
        set start = item.get('start') %}\n    {% set end = item.get('end') %}\n  {%
        else %}\n    {% set start = item[0] %}\n    {% set end = item[1] %}\n  {%
        endif %}\n  {% set start_dt = as_datetime(start) if start is not none else
        none %}\n  {% set end_dt = as_datetime(end) if end is not none else none %}\n
        \ {% if start_dt is none or end_dt is none %}\n    {% continue %}\n  {% endif
        %}\n  {% if end_dt > window_start and start_dt < window_end %}\n    {% set
        slots.count = slots.count + 1 %}\n  {% endif %}\n{% endfor %} {{ slots.count
        }}"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not granny_tomorrow_valid }}'
      sequence:
      - action: logbook.log
        data:
          name: '[Granny AI-Laddning]'
          message: 'Planeringen stoppad: tomorrow_valid är False. Trigger: {{ trigger.description
            | default(trigger.id | default(trigger.platform | default("ok"))) }}.'
      - stop: Väntar på morgondagens priser.
    - conditions:
      - condition: template
        value_template: '{{ granny_price_slots | int(0) == 0 }}'
      sequence:
      - action: logbook.log
        data:
          name: '[Granny AI-Laddning]'
          message: 'Planeringen stoppad: inga prisintervall överlappar fönstret. Trigger:
            {{ trigger.description | default(trigger.id | default(trigger.platform
            | default("ok"))) }}.'
      - stop: Väntar på prisdata.
  - action: script.granny_car_charge_plan
    metadata: {}
    data:
      notify_user: '{{ granny_notify_user }}'
  mode: restart

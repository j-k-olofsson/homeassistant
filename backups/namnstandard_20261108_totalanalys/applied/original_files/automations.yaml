- id: dashboard_completion_prusa
  alias: "Kontrollpanel – 3D-utskrift färdig"
  description: Visa ett kvitterbart klarbesked i en timme efter bekräftat avslut.
    Ny körning tar bort beskedet.
  triggers:
  - trigger: state
    entity_id: sensor.prusaxl
    to: finished
    id: done
  - trigger: state
    entity_id: sensor.prusaxl
    to: printing
    id: running
  actions:
  - choose:
    - conditions: '{{ trigger.id == ''done'' and trigger.from_state is not none and
        trigger.from_state.state in [''printing'', ''paused'', ''attention'', ''busy'']
        }}'
      sequence:
      - action: timer.start
        target:
          entity_id: timer.kontrollpanel_fardig_3d_utskrift
        data:
          duration: 01:00:00
    - conditions: '{{ trigger.id == ''running'' }}'
      sequence:
      - action: timer.cancel
        target:
          entity_id: timer.kontrollpanel_fardig_3d_utskrift
  mode: restart

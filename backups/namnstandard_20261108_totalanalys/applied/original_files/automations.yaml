- id: '1669464923530'
  alias: Kontrollera låga batterinivåer
  description: Meddelar mobilen när något batteri har för låg nivå (<15%) för att
    säkerställa att alla sensorer fungerar som de ska. Automation körs dagligen kl.
    02:00. Kontroll av batterinivåer görs för både vanlig och binär sensor.
  triggers:
  - at: 02:00:00
    trigger: time
  conditions:
  - condition: template
    value_template: '{{ sensors != '''' and (day | int == 0 or day | int == now().isoweekday())
      }}'
  actions:
  - choose: []
    default:
    - action: script.granny_broadcast
      metadata: {}
      data:
        severity: warn
        humor_level: 2
        tts_media_player: media_player.grannys_hogtalare_music_assistant
        task: 'Låg batterinivå: {{ sensors }}'
        channels:
        - mobile
        - ha
  variables:
    day: 0
    threshold: 15
    exclude:
      entity_id: []
    sensors: "{% from 'ha_namn.jinja' import namn %}\n{% set result = namespace(sensors=[]) %} {% for state in states.sensor | selectattr('attributes.device_class', '==', 'battery') %}\n  {% if 0 <= state.state | int(-1) < threshold | int and not state.entity_id in exclude.entity_id %}\n    {% set result.sensors = result.sensors + [namn(state.entity_id) ~ ' (' ~ state.state ~ ' %)'] %}\n  {% endif %}\n{% endfor %} {% for state in states.binary_sensor | selectattr('attributes.device_class', '==', 'battery') | selectattr('state', '==', 'on') %}\n  {% if not state.entity_id in exclude.entity_id %}\n    {% set result.sensors = result.sensors + [namn(state.entity_id)] %}\n  {% endif %}\n{% endfor %} {{result.sensors|join(', ')}}"
  mode: queued
  max: 10
- id: '1670227045254'
  alias: "Belysning – Dagsljus och Nattbelysning"
  description: Denna automation anpassar belysningen efter solens olika faser och
    tidpunkter på dygnet. Den slår på lampor vid gryning och skymning, samt stänger
    av dem när tid för nattljus har ankommit. Den styr också scener för olika belysningslägen
    baserat på tid och ljusförhållanden.
  triggers:
  - at: input_datetime.heimdal_ha_lampor_tands
    id: dawn_by_time
    trigger: time
  - entity_id:
    - input_select.heimdal_ha_solens_dygnsfas
    to: SUNPHASE_SUNRISE
    id: dawn
    trigger: state
  - entity_id:
    - input_select.heimdal_ha_solens_dygnsfas
    to: SUNPHASE_DAYLIGHT
    id: daylight
    trigger: state
  - entity_id:
    - input_select.heimdal_ha_solens_dygnsfas
    to: SUNPHASE_SUNSET
    id: dusk
    trigger: state
  - entity_id:
    - input_select.heimdal_ha_solens_dygnsfas
    to: SUNPHASE_NIGHT
    id: night
    trigger: state
  - at: input_datetime.heimdal_ha_lampor_slacks
    id: night_by_time
    trigger: time
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: dawn_by_time
      - condition: not
        conditions:
        - condition: state
          entity_id: input_select.heimdal_ha_solens_dygnsfas
          state: SUNPHASE_DAYLIGHT
      sequence:
      - data:
          option: DAWN
        target:
          entity_id: input_select.light_scene
        action: input_select.select_option
    - conditions:
      - condition: trigger
        id: daylight
      sequence:
      - data:
          option: DAY
        target:
          entity_id: input_select.light_scene
        action: input_select.select_option
      - action: light.turn_off
        target:
          entity_id:
          - light.skymningsbelysning
        data: {}
    - conditions:
      - condition: trigger
        id: dusk
      - condition: not
        conditions:
        - condition: state
          entity_id: input_select.light_scene
          state: NIGHT
      sequence:
      - data:
          option: DUSK
        target:
          entity_id: input_select.light_scene
        action: input_select.select_option
      - condition: state
        entity_id: input_boolean.guest_mode
        state: 'off'
        enabled: false
      - metadata: {}
        data: {}
        target:
          entity_id: light.skymningsbelysning
        action: light.turn_on
    - conditions:
      - condition: trigger
        id: night_by_time
      sequence:
      - data:
          option: DUSK
        target:
          entity_id: input_select.light_scene
        action: input_select.select_option
      - delay:
          hours: 0
          minutes: 0
          seconds: 5
          milliseconds: 0
      - data:
          option: NIGHT
        target:
          entity_id: input_select.light_scene
        action: input_select.select_option
      - action: light.turn_on
        data:
          rgb_color:
          - 255
          - 0
          - 0
        target:
          entity_id: light.skymningsbelysning
      - condition: state
        entity_id: input_boolean.guest_mode
        state: 'off'
  mode: queued
  max: 10
- id: '1670242070937'
  alias: Solens dygnsfaser
  description: Denna automation uppdaterar solens faser (soluppgång, dagsljus, solnedgång,

  - entity_id: sun.sun
    above: 0
    id: day
    attribute: elevation
    trigger: numeric_state
  - entity_id:
    - sun.sun
    below: 2
    id: dusk
    attribute: elevation
    trigger: numeric_state
  - entity_id: sun.sun
    below: -6
    id: night
    attribute: elevation
    trigger: numeric_state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: dawn
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.heimdal_ha_solens_dygnsfas
        data:
          option: SUNPHASE_SUNRISE
    - conditions:
      - condition: trigger
        id: day
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.heimdal_ha_solens_dygnsfas
        data:
          option: SUNPHASE_DAYLIGHT
    - conditions:
      - condition: trigger
        id: dusk
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.heimdal_ha_solens_dygnsfas
        data:
          option: SUNPHASE_SUNSET
    - conditions:
      - condition: trigger
        id: night
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.heimdal_ha_solens_dygnsfas
        data:
          option: SUNPHASE_NIGHT
  mode: queued
  max: 10

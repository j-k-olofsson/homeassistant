# Quarter-based electricity cost tooling
template:
  - trigger:
      - platform: time_pattern
        minutes: "/15"
    sensor:
      - name: Elpris per kvart
        unique_id: quarter_energy_price
        unit_of_measurement: "SEK/kWh"
        state_class: measurement
        icon: mdi:cash-clock
        state: >-
          {% set base = states('sensor.heimdal_ha_nordpool_kwh_se3_sek_3_10_025_inkopspris') | float(0) %}
          {% set trade = states('input_number.elpris_handelsavgift') | float(0) %}
          {% set spot_fee = states('input_number.elpris_spotpaslag') | float(0) %}
          {% set certificate = states('input_number.elpris_certifikatsavgift') | float(0) %}
          {% set transfer = states('input_number.elpris_overforingsavgift') | float(0) %}
          {% set tax = states('input_number.elpris_energiskatt') | float(0) %}
          {% set vat = states('input_number.elpris_moms') | float(25) %}
          {% set subtotal = base + trade + spot_fee + certificate + transfer + tax %}
          {{ (subtotal * (1 + vat / 100)) | round(5) }}
        attributes:
          quarter_start: >-
            {{ now().replace(minute=(now().minute//15)*15, second=0, microsecond=0).isoformat() }}

sql:
  - name: Kvartbaserad elkostnadsprognos
    unique_id: quarter_based_cost_forecast
    db_url: !secret mariadb_db_url
    unit_of_measurement: ":-"
    column: forecast
    query: >-
      WITH params AS (
        SELECT
          UNIX_TIMESTAMP(DATE_FORMAT(NOW(), '%Y-%m-01 00:00:00')) AS month_start_ts,
          DAYOFMONTH(LAST_DAY(NOW())) AS days_in_month
      ),
      power_q AS (
        SELECT
          FLOOR(st.start_ts / 900) * 900 AS quarter_ts,
          AVG(CAST(st.mean AS DECIMAL(16,6))) AS avg_kw
        FROM statistics_short_term st
        WHERE st.metadata_id = (
            SELECT id
            FROM statistics_meta
            WHERE statistic_id = 'sensor.utomhus_elmatare_elstolpen_forbrukad_effekt'
          )
          AND st.start_ts >= (SELECT month_start_ts FROM params)
        GROUP BY quarter_ts
        HAVING avg_kw > 0
      ),
      price AS (
        SELECT
          FLOOR(last_updated_ts / 900) * 900 AS quarter_ts,
          MAX(CAST(state AS DECIMAL(10,6))) AS price
        FROM states
        WHERE metadata_id = (SELECT metadata_id FROM states_meta WHERE entity_id = 'sensor.elpris_per_kvart')
          AND last_updated_ts >= (SELECT month_start_ts FROM params)
        GROUP BY quarter_ts
      ),
      joined AS (
        SELECT
          pwr.quarter_ts,
          (pwr.avg_kw * 0.25) AS kwh,
          pr.price
        FROM power_q pwr
        JOIN price pr ON pr.quarter_ts = pwr.quarter_ts
      ),
      summary AS (
        SELECT
          SUM(price * kwh) AS cost_so_far,
          COUNT(*) AS measured_quarters
        FROM joined
      ),
      monthly_fee AS (
        SELECT CAST(state AS DECIMAL(10,2)) AS fee
        FROM states
        WHERE metadata_id = (SELECT metadata_id FROM states_meta WHERE entity_id = 'input_number.manadsavgifter_elhandel_nat')
        ORDER BY state_id DESC
        LIMIT 1
      )
      SELECT ROUND(
        COALESCE(
          (
            SELECT (cost_so_far / NULLIF(measured_quarters, 0)) * ((SELECT days_in_month FROM params) * 96)
            FROM summary
          ),
          0
        ) + COALESCE((SELECT fee FROM monthly_fee), 0),
        0
      ) AS forecast;

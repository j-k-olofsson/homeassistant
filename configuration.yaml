# Loads default set of integrations. Do not remove.
default_config:

# Define global log-level
logger:
  default: info
  logs:
    homeassistant.config_entries: warning
    custom_components.openwrt_wifi_clients: info

# logger:
#   default: info
#   logs:
#     homeassistant.components.automation: debug

# MaraiaDB specific configuration
# recorder:
#   db_url: !secret mariadb_db_url
#   purge_keep_days: 14
#   auto_purge: true
#   commit_interval: 30
#   exclude:
#     entities:
#       # Elmätare – fasström (behåll energi per timme/dag, rör ej!)
#       - sensor.elmatare_elstolpen_current_phase_1
#       - sensor.elmatare_elstolpen_current_phase_2
#       - sensor.elmatare_elstolpen_current_phase_3

recorder:
  db_url: !secret mariadb_db_url
  auto_purge: true
  purge_keep_days: 10
  commit_interval: 5

  exclude:
    # Ta bort hela domäner som oftast skräpar
    domains:
      - persistent_notification
      - camera
      - image_processing
      - media_player
      - weather
      - updater

    # Generiska mönster (globbar) – inga hårdkodade namn
    entity_globs:
      # Tickande klock-/datum-/uptime-sensorer
      - sensor.time*
      - sensor.date*
      - sensor.uptime*

      # OpenWRT (alla sensorer från integrationen)
      - sensor.openwrt_*

      # ESPHome-lampor – högfrekvent brus (behåll ev. *_energy)
      - sensor.*_light_power
      - sensor.*_light_voltage
      - sensor.*_light_current

      # Elmätare: exkludera effekt/spänning (behåll energy/kWh för Energi)
      - sensor.elmatare_*_power*
      - sensor.elmatare_*_voltage*
      - sensor.elmatare_*_current_phase_*

      # System-/CPU-last etc.
      - sensor.system_monitor_load_*
      - sensor.system_monitor_packets_*
      - sensor.processor_*
      - sensor.*_wi_fi_clients
      - sensor.all_wi_fi_clients*
      - sensor.*_uptime_30_days*
      - sensor.*_uptime_365_days*
      - sensor.*_response_time_o_1_day*
      - sensor.*_response_time_o_30_days*
      - sensor.*_response_time_o_365_days*
      - sensor.ha_states_rows_24h

      # Aqara-monitorering som tidigare gav mycket historik
      - automation.aqara_taklampor_monitor_service_calls
      - sensor.aqara_taklampor_senaste_analys
      - input_text.aqara_taklampor_senaste_kommando

    # Brusiga eventtyper som sällan behövs i recorder
    event_types:
      - call_service
      - entity_registry_updated
      - service_registered
      - service_removed
      - component_loaded
      - logbook_entry
      - automation_triggered
      - automation_reloaded
      - recorder_5min_statistics_generated
      - recorder_hourly_statistics_generated
      - device_registry_updated
      - panels_updated
      - core_config_updated
      - lovelace_updated
    entities:
      - sensor.thread_network_diagnostics

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /local/card-mod.js

# Load automations, scripts and scenes from separate files (System - do not move or alter)
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Load extra configurationes as described in separate files in dir packages/
homeassistant:
  packages: !include_dir_named packages
  allowlist_external_dirs:
    - /config/file_notifications
  auth_mfa_modules:
    - type: totp
    
# Text to speech
tts:
  - platform: google_translate

rest_command:
  thread_get_devices:
    url: "http://192.168.10.2:8081/api/devices"
    method: get
    headers:
      Accept: "application/json"
    timeout: 10
  thread_get_diagnostics:
    url: "http://192.168.10.2:8081/api/actions"
    method: post
    headers:
      Accept: "application/vnd.api+json"
    content_type: "application/vnd.api+json"
    payload: >-
      {
        "data": [{
          "type": "getNetworkDiagnosticTask",
          "attributes": {
            "destination": "{{ destination }}",
            "types": [
              "extAddress",
              "rloc16",
              "eui",
              "threadVersion",
              "vendorName",
              "vendorModel",
              "vendorSwVersion",
              "threadStackVersion",
              "childTable",
              "children",
              "routerNeighbors",
              "mleCounters"
            ],
            "timeout": 30
          }
        }]
      }
  thread_get_diagnostics_result:
    url: "http://192.168.10.2:8081/api/diagnostics"
    method: get
    headers:
      Accept: "application/json"
    timeout: 10

template:
  - triggers:
      - trigger: state
        entity_id: script.thread_uppdatera_natverksdiagnostik
        from: "on"
        to: "off"

    actions:
      - action: rest_command.thread_get_diagnostics_result
        response_variable: thread_diag

    sensor:
      - name: "Thread Network Diagnostics"
        unique_id: thread_network_diagnostics
        icon: mdi:access-point-network

        state: >
          {{ thread_diag.content | count }}

        attributes:
          updated: >
            {{ now().isoformat() }}

          diagnostics: >
            {% set src = thread_diag.content or [] %}
            {% set result = namespace(items=[], seen=[]) %}

            {% for d in src %}

              {% set addr =
                   d.extAddress
                   | default('')
                   | lower %}

              {% if addr != ''
                    and addr not in result.seen %}

                {% set matches =
                     src
                     | selectattr(
                         'extAddress',
                         'defined'
                       )
                     | selectattr(
                         'extAddress',
                         'equalto',
                         d.extAddress
                       )
                     | list %}

                {% set best =
                     namespace(
                       item=d,
                       count=-1
                     ) %}

                {% set meta =
                     namespace(
                       stack='',
                       vendor='',
                       model=''
                     ) %}

                {% for c in matches %}

                  {% set neighbors =
                       c.routerNeighbors
                       | default([], true) %}

                  {% set cnt =
                       neighbors
                       | count %}

                  {% if cnt > best.count %}
                    {% set best.item = c %}
                    {% set best.count = cnt %}
                  {% endif %}

                  {% if meta.stack == ''
                        and
                        (c.threadStackVersion
                         | default('')
                         | trim) != '' %}

                    {% set meta.stack =
                         c.threadStackVersion %}

                  {% endif %}

                  {% if meta.vendor == ''
                        and
                        (c.vendorName
                         | default('')
                         | trim) != '' %}

                    {% set meta.vendor =
                         c.vendorName %}

                  {% endif %}

                  {% if meta.model == ''
                        and
                        (c.vendorModel
                         | default('')
                         | trim) != '' %}

                    {% set meta.model =
                         c.vendorModel %}

                  {% endif %}

                {% endfor %}


                {% set compact_neighbors =
                     namespace(items=[]) %}

                {% for n in
                     best.item.routerNeighbors
                     | default([], true) %}

                  {% set compact_neighbors.items =
                       compact_neighbors.items
                       +
                       [
                         dict(
                           averageRssi =
                             n.averageRssi
                             | default(none),
                           lastRssi =
                             n.lastRssi
                             | default(none),
                           linkMargin =
                             n.linkMargin
                             | default(none),
                           messageErrorRate =
                             n.messageErrorRate
                             | default(0),
                           frameErrorRate =
                             n.frameErrorRate
                             | default(0)
                         )
                       ] %}

                {% endfor %}


                {% set result.items =
                     result.items
                     +
                     [
                       dict(
                         extAddress=addr,
                         threadStackVersion=
                           meta.stack,
                         vendorName=
                           meta.vendor,
                         vendorModel=
                           meta.model,
                         routerNeighbors=
                           compact_neighbors.items
                       )
                     ] %}

                {% set result.seen =
                     result.seen + [addr] %}

              {% endif %}

            {% endfor %}

            {{ result.items }}
          
command_line:
  - sensor:
      name: Thread Matter Topology
      unique_id: thread_matter_topology
      command: 'python3 /config/thread_matter_topology.py'
      command_timeout: 20
      scan_interval: 600
      value_template: "{{ value_json.count }}"
      json_attributes:
        - nodes
        - collected_at
        - connections
        - child_links
  - sensor:
      name: Nest Hub Test 210
      unique_id: nest_hub_test_210
      command: >-
        python3 -c "from pychromecast.dial import get_device_info;
        d=get_device_info('192.168.10.213', timeout=8);
        print('NONE' if d is None else str(d))"
      command_timeout: 15
      scan_interval: 3600

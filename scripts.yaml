godnatt_slack_belysning:
  alias: Godnatt – släck och kontrollera belysningen
  description: >-
    Släcker Godnatt-gruppens enskilda lampor och de två befintliga verkstadsbrytarna.
    Gör högst tre försök och loggar enheter vars släckning inte kunde bekräftas.
  mode: single
  sequence:
  - variables:
      _targets: >-
        {{ (expand('light.grupp_godnatt') | map(attribute='entity_id') | list
            + ['switch.shelly_pro_3_verkstaden_switch_1',
               'switch.shelly_pro_3_verkstaden_switch_2']) | unique | list }}
      _pending: '{{ _targets }}'
  - repeat:
      sequence:
      - repeat:
          for_each: '{{ _pending }}'
          sequence:
          - action: homeassistant.turn_off
            continue_on_error: true
            target:
              entity_id: '{{ repeat.item }}'
      - delay: '00:00:03'
      - variables:
          _pending: >-
            {% set remaining = namespace(entities=[]) %}
            {% for entity_id in _targets %}
              {% if not is_state(entity_id, 'off') %}
                {% set remaining.entities = remaining.entities + [entity_id] %}
              {% endif %}
            {% endfor %}
            {{ remaining.entities }}
      until:
      - condition: template
        value_template: '{{ _pending | length == 0 or repeat.index >= 3 }}'
  - if:
    - condition: template
      value_template: '{{ _pending | length > 0 }}'
    then:
    - action: system_log.write
      data:
        level: warning
        logger: godnatt.belysning
        message: >-
          Godnatt kunde inte bekräfta släckning efter tre försök:
          {{ _pending | join(', ') }}.
  - variables:
      _godnatt_result:
        targets: '{{ _targets }}'
        unconfirmed: '{{ _pending }}'
  - stop: Släckning klar; se resultatet för eventuell kvarvarande belysning.
    response_variable: _godnatt_result
ange_starttid_for_bilvarmen:
  alias: Ange starttid för bilvärmen
  description: Bokar bilvärme en gång. Laddningen slås på en minut före vald värmestart.
  sequence:
  - variables:
      _requested_ts: '{{ as_timestamp(starttid, 0) }}'
      _start_ts: '{{ ((_requested_ts | float / 60) | round(0, "ceil")) * 60 }}'
      _laddstart_ts: '{{ _start_ts | float - 60 }}'
  - if:
    - condition: template
      value_template: '{{ _laddstart_ts | float <= as_timestamp(now()) + 60 }}'
    then:
    - stop: Välj värmestart minst två minuter framåt så att laddningen hinner slås på först.
      error: true
  - action: scheduler.add
    data:
      name: 'Bilvärme {{ _start_ts | timestamp_custom("%d/%m %H:%M", true) }}'
      weekdays:
      - daily
      start_date: '{{ _laddstart_ts | timestamp_custom("%Y-%m-%d", true) }}'
      end_date: '{{ _laddstart_ts | timestamp_custom("%Y-%m-%d", true) }}'
      repeat_type: single
      tags:
      - bilvarme_ad_hoc
      timeslots:
      - start: '{{ _laddstart_ts | timestamp_custom("%H:%M", true) }}'
        actions:
        - service: script.turn_on
          entity_id: script.bilvarme_starta_en_gang
  mode: single
  icon: mdi:clock-time-five-outline
  fields:
    starttid:
      selector:
        datetime: {}
      name: Datum och starttid för bilvärmen
      description: Laddningen aktiveras en minut tidigare. Välj minst två minuter framåt.
      required: true

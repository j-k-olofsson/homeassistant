ange_starttid_for_bilvarmen:
  alias: Ange starttid för bilvärmen
  sequence:
  - service: input_datetime.set_datetime
    metadata: {}
    data:
      datetime: '{{ starttid }}'
    target:
      entity_id: input_datetime.starta_bilvarmen
  mode: single
  icon: mdi:clock-time-five-outline
  fields:
    starttid:
      selector:
        datetime: {}
      name: starttid
      required: true
rescan_wifi_on_esphome_nodes:
  alias: Rescan wifi on all esphome nodes
  description: ''
  sequence:
  - repeat:
      for_each: '{{ integration_entities(''esphome'') | select(''search'', ''_wifi_bssid$'')
        | list | sort }}'
      sequence:
      - action: esphome.esphome{{ repeat.item[14:16] }}_scan_wifi
        continue_on_error: true
      - action: notify.send_message
        continue_on_error: true
        data:
          message: 'Rescan wifi: esphome{{ repeat.item[14:16] }}'
        target:
          entity_id: notify.file
granny_broadcast:
  alias: Granny Broadcast (kanalneutral)
  description: 'Grannifiera en uppgift och (valfritt) skicka till valda kanaler. Returnerar
    alltid final_message.

    '
  mode: parallel
  max: 50
  fields:
    task:
      name: task
      description: Kort instruktion till Granny (obligatorisk)
      required: true
      selector:
        text: {}
    severity:
      name: severity
      selector:
        select:
          options:
          - info
          - warn
          - crit
      default: info
    humor_level:
      name: humor_level
      selector:
        number:
          min: 0
          max: 3
          step: 1
      default: 2
    recipient:
      name: recipient
      description: Namn att tilltala (t.ex. Diego)
      selector:
        text: {}
    channels:
      name: Kanaler
      description: Välj en eller flera kanaler (lämna tom för att inte skicka något)
      selector:
        select:
          multiple: true
          options:
          - label: TTS (högtalare/grupp)
            value: tts
          - label: Mobil (notify.mobile_app_pixel_9_pro_xl)
            value: mobile
          - label: TV (notify.android_tv_fire_tv)
            value: tv
          - label: HA-notis (persistent_notification)
            value: ha
    tts_media_player:
      name: tts_media_player
      description: 'Högtalare eller grupp för TTS (fallback = media_player.grupp_grannys_hogtalare)

        '
      selector:
        entity:
          domain: media_player
    fallback_message:
      name: fallback_message
      description: 'Eget fallbackmeddelande om AI inte svarar. Lämna tomt för neutral
        standardfras.

        '
      selector:
        text: {}
  sequence:
  - variables:
      _ai_entity: ai_task.ollama_ai_task
      _severity: '{{ severity | default(''info'') }}'
      _humor: '{{ humor_level | int(2) }}'
      _recipient: '{{ (recipient | default('''', true)) | trim }}'
      _tts_player: "{{ tts_media_player\n   if tts_media_player is defined and tts_media_player|length
        > 0\n   else 'media_player.grupp_grannys_hogtalare' }}\n"
      _tts_engine: "{% if states('tts.piper') not in ['unknown','unavailable','']
        %}\n  tts.piper\n{% elif states('tts.cloud') not in ['unknown','unavailable','']
        %}\n  tts.cloud\n{% else %}\n  tts.cloud\n{% endif %}\n"
      _fallback_input: '{{ (fallback_message | default('''', true)) | trim }}'
      _fallback_default: Jag har glömt bort vad jag skulle säga, och även vad jag
        heter…
      _fallback_final: '{{ _fallback_input if _fallback_input|length > 0 else _fallback_default
        }}

        '
      _channels: '{{ channels if channels is defined else [] }}

        '
      _base_task: '{{ task }}'
      _prompt: 'Du är "Granny": varm, saklig, kvick och surmulen. Svara alltid på
        svenska. Humor-nivå: {{ _humor }} (0=ingen, 3=lekfull men kort). Allvar: {{
        _severity }}. {{ ''Tilltala '' ~ _recipient ~ ''.'' if _recipient|length >
        0 else '''' }} Uppdrag: {{ _base_task }} Krav: Max 40 ord. Kort, tydligt,
        vänligt. Ingen emoji. Alltid nya unika meddelanden, aldrig upprepningar.'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ states(_ai_entity) not in [''unknown'',''unavailable'','''']
          }}

          '
      sequence:
      - action: ai_task.generate_data
        data:
          entity_id: '{{ _ai_entity }}'
          instructions: '{{ _prompt }}'
          task_name: granny_broadcast
        response_variable: ai_out
      - variables:
          ai_text: "{{ (ai_out.data if ai_out is defined and 'data' in ai_out\n    else
            '') | string | trim }}\n"
    default:
    - variables:
        ai_text: ''
  - variables:
      final_message: '{{ ai_text if (ai_text | length) > 0 else _fallback_final }}

        '
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ ''tts'' in _channels }}'
      sequence:
      - action: tts.speak
        continue_on_error: true
        target:
          entity_id: '{{ _tts_engine }}'
        data:
          media_player_entity_id: '{{ _tts_player }}'
          message: '{{ final_message }}'
          cache: false
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ ''mobile'' in _channels }}'
      sequence:
      - action: notify.mobile_app_pixel_9_pro_xl
        data:
          title: Granny ({{ _severity }})
          message: '{{ final_message }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ ''tv'' in _channels }}'
      sequence:
      - action: notify.android_tv_fire_tv
        data:
          title: Granny
          message: '{{ final_message }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ ''ha'' in _channels }}'
      sequence:
      - action: persistent_notification.create
        data:
          title: Granny ({{ _severity }})
          message: '{{ final_message }}'
  - stop: '{{ final_message }}'
    response_variable: final_message

granny_car_charge_plan:
  alias: Granny Bil-laddningsplan (AI)
  description: Planerar bilens laddning via den lokala LLM:n och uppdaterar kalendern.
  mode: restart
  sequence:
  - variables:
      log_prefix: '[Granny AI-Laddning]'
      status_notification_id: granny_plan_status
      slot_minutes: 15
      now_dt: '{{ now() }}'
      now_iso: '{{ now().isoformat() }}'
      deadline_iso: >-
        {% set base = today_at('05:30:00') %}
        {{ (base if now() < base else (base + timedelta(days=1))).isoformat() }}
      deadline_local_iso: '{{ as_local(as_datetime(deadline_iso)).isoformat() }}'
      cleanup_end_iso: >-
        {{ (today_at('23:59:59') + timedelta(days=1)).isoformat() }}
      car_soc: '{{ states("sensor.sef_42h_battery_level") | float(0) }}'
      car_target: '{{ states("input_number.car_target_soc") | float(100) }}'
      car_capacity_kwh: '{{ states("input_number.car_bat_capacity") | float(0) }}'
      car_charger_kw: '{{ states("input_number.car_charger_capacity") | float(0) }}'
      car_efficiency: '{{ states("input_number.car_charger_efficiency") | float(1) }}'
      energy_needed_kwh: >-
        {% set diff = (car_target | float(0)) - (car_soc | float(0)) %}
        {% if diff <= 0 or (car_capacity_kwh | float(0)) <= 0 %}
          {{ 0.0 }}
        {% else %}
          {{ ((diff / 100) * (car_capacity_kwh | float(0))) | float(0) }}
        {% endif %}
      slot_energy_kwh: >-
        {% set kw = car_charger_kw | float(0) %}
        {% set eff = car_efficiency | float(1) %}
        {% set minutes = slot_minutes | float(0) %}
        {% set duration = minutes / 60 %}
        {% if kw <= 0 or duration <= 0 or eff <= 0 %}
          {{ 0.0 }}
        {% else %}
          {{ (kw * duration * eff) | float(0) }}
        {% endif %}
      min_slots_required: >-
        {% set needed = energy_needed_kwh | float(0) %}
        {% set per_slot = slot_energy_kwh | float(0) %}
        {% if needed <= 0 or per_slot <= 0 %}
          0
        {% else %}
          {{ (needed / per_slot) | round(0, 'ceil') | int }}
        {% endif %}
      price_payload: >-
        {% set sensor = 'sensor.nordpool' %}
        {% set raw_today = state_attr(sensor, 'raw_today') or [] %}
        {% set raw_tomorrow = state_attr(sensor, 'raw_tomorrow') or [] %}
        {% set window_start = as_datetime(now_iso) %}
        {% set window_end = as_datetime(deadline_iso) %}
        {% set today_ns = namespace(items=[]) %}
        {% for item in raw_today %}
          {% if item is mapping %}
            {% set start = item.get('start') %}
            {% set end = item.get('end') %}
            {% set value = item.get('value') %}
          {% else %}
            {% set start = item[0] %}
            {% set end = item[1] %}
            {% set value = item[2] %}
          {% endif %}
          {% set start_dt = as_datetime(start) if start is not none else none %}
          {% set end_dt = as_datetime(end) if end is not none else none %}
          {% if start_dt is none or end_dt is none %}
            {% continue %}
          {% endif %}
          {% if end_dt <= window_start or start_dt >= window_end %}
            {% continue %}
          {% endif %}
          {% set today_ns.items = today_ns.items + [{
            "start": start_dt.isoformat(),
            "end": end_dt.isoformat(),
            "value": value | float(0)
          }] %}
        {% endfor %}
        {% set tomorrow_ns = namespace(items=[]) %}
        {% for item in raw_tomorrow %}
          {% if item is mapping %}
            {% set start = item.get('start') %}
            {% set end = item.get('end') %}
            {% set value = item.get('value') %}
          {% else %}
            {% set start = item[0] %}
            {% set end = item[1] %}
            {% set value = item[2] %}
          {% endif %}
          {% set start_dt = as_datetime(start) if start is not none else none %}
          {% set end_dt = as_datetime(end) if end is not none else none %}
          {% if start_dt is none or end_dt is none %}
            {% continue %}
          {% endif %}
          {% if end_dt <= window_start or start_dt >= window_end %}
            {% continue %}
          {% endif %}
          {% set tomorrow_ns.items = tomorrow_ns.items + [{
            "start": start_dt.isoformat(),
            "end": end_dt.isoformat(),
            "value": value | float(0)
          }] %}
        {% endfor %}
        {{
          {
            "currency": state_attr(sensor, "currency"),
            "vat": state_attr(sensor, "vat"),
            "today": today_ns.items,
            "tomorrow": tomorrow_ns.items
          } | tojson
        }}
      price_currency: "{{ state_attr('sensor.nordpool', 'currency') | default('SEK') }}"
      ai_context: >-
        {{
          {
            "fakta": {
              "nuvarande_soc_procent": car_soc,
              "mal_soc_procent": car_target,
              "batterikapacitet_kwh": car_capacity_kwh,
            "laddare_kw": car_charger_kw,
            "verkningsgrad": car_efficiency,
            "slot_langd_minuter": slot_minutes,
            "starttid_iso": now_iso,
            "deadlinetid_iso": deadline_iso,
            "deadlinetid_local": deadline_local_iso,
            "energi_behov_kwh": energy_needed_kwh | float(0),
            "energi_per_slot_kwh": slot_energy_kwh | float(0),
            "min_antal_slotar": min_slots_required,
          },
          "prisdata": price_payload | from_json
        } | tojson
        }}
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ car_capacity_kwh | float(0) <= 0 }}'
      sequence:
      - action: logbook.log
        data:
          name: '{{ log_prefix }}'
          message: 'Planeringen stoppad: sätt ett värde på input_number.car_bat_capacity.'
      - action: persistent_notification.create
        data:
          title: Laddningsplan saknar batterikapacitet
          message: >-
            Ange bilens batterikapacitet i input_number.car_bat_capacity för att kunna planera laddningen.
          notification_id: granny_car_charge_plan_config_error
      - stop: Saknar batterikapacitet.
    - conditions:
      - condition: template
        value_template: '{{ car_charger_kw | float(0) <= 0 }}'
      sequence:
      - action: logbook.log
        data:
          name: '{{ log_prefix }}'
          message: 'Planeringen stoppad: sätt ett värde på input_number.car_charger_capacity.'
      - action: persistent_notification.create
        data:
          title: Laddningsplan saknar laddareffekt
          message: >-
            Ange laddarens effekt i input_number.car_charger_capacity för att kunna planera laddningen.
          notification_id: granny_car_charge_plan_config_error
      - stop: Saknar laddareffekt.
  - action: logbook.log
    data:
      name: '{{ log_prefix }}'
      message: 'Startar AI-planering av bilens laddning.'
  - action: ai_task.generate_data
    data:
      entity_id: ai_task.ollama_ai_task
      task_name: granny_charge_plan
      instructions: >-
        SYSTEM Du är Granny-planeraren, bilens energiboss. Tala enbart svenska och
        var kortfattad men rak.

        DATA_JSON {{ ai_context }}

        KRAV
        - Arbeta strikt inom tidsfönstret [starttid_iso, deadlinetid_iso). Inga slotar
          får sluta efter deadlinetid_iso.
        - Varje slot är {{ slot_minutes }} minuter och ger ungefär {{ slot_energy_kwh
          | float(0) | round(3) }} kWh.
        - Energi att fylla på: {{ energy_needed_kwh | float(0) | round(3) }} kWh,
          minst {{ min_slots_required }} slotar.
        - Använd ALLTID valutan {{ price_currency }} i både text och JSON (skriv
          t.ex. \"{{ price_currency }}\" eller \"{{ price_currency }}/kWh\", aldrig
          €, $, eller andra valutor). Belopp ska anges i {{ price_currency }} och per
          slot även som \"price_sek_kwh\" och \"cost_sek\".
        - Svara alltid på svenska och håll sammanfattningen max 60 ord.

        UPPDRAG
        1. Om energibehovet är <= 0, markera status "klar" och returnera tom schedule.
        2. Dela upp prisintervallen i {{ slot_minutes }}-minutersslotar inom fönstret
           och välj de billigaste tills energibehovet uppfylls senast deadlinetid_iso.
        3. För varje slot: ange start, slut, energy_kwh (≈ {{ slot_energy_kwh | float(0) | round(3) }}),
           price_sek_kwh och cost_sek (energy_kwh * pris). Ange källa (id från
           prislistan, t.ex. "nordpool.today").
        4. Summera status, inkludera om deadlinen hålls, och ge korta noter.

        SVARFORMAT
        Svara ENBART med JSON. Ingen text före eller efter. Följ exakt detta schema:
        {
          "status": "kort status",
          "summary": "kort svensk text",
          "notes": "extra info eller tom sträng",
          "deadline_met": true,
          "slots_planned": 0,
          "schedule": [
            {
              "start": "ISO8601",
              "end": "ISO8601",
              "energy_kwh": 0.0,
              "price_sek_kwh": 0.0,
              "cost_sek": 0.0,
              "source": "text"
            }
          ]
        }
        Alla fält måste finnas. schedule får vara tom men ska då vara []. Använd decimalpunkt.
        Kontrollera att starttid >= starttid_iso och sluttid <= deadlinetid_iso.
    response_variable: ai_plan
  - action: system_log.write
    data:
      message: 'AI-plan debug: {{ ai_plan | tojson }}'
      level: info
      logger: granny_car_charge_plan
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ ai_plan.error | default('') | string | length > 0 }}"
      sequence:
      - action: logbook.log
        data:
          name: '{{ log_prefix }}'
          message: 'AI-samtalet misslyckades: {{ ai_plan.error }}'
      - action: persistent_notification.create
        data:
          title: Bil-laddningsplan misslyckades
          message: 'AI-samtalet misslyckades: {{ ai_plan.error }}'
          notification_id: granny_car_charge_plan_error
      - stop: AI-samtalet misslyckades.
  - variables:
      ai_raw: '{{ ai_plan.data | default("") | string | trim }}'
      ai_clean: >-
        {% set raw = ai_raw | trim %}
        {% if raw[:1] == '"' %}
          {{ raw | from_json(default=raw) | string | trim }}
        {% else %}
          {{ raw }}
        {% endif %}
      ai_json_text: >-
        {% set text = ai_clean | trim %}
        {% set text = text | replace('```', '') %}
        {% set text = text | regex_replace('(?i)^json\\s*', '') %}
        {% set text = text | regex_replace('^[:=\\s]+', '') %}
        {% set stripped = text | regex_replace('^\\s+', '') %}
        {% if stripped.startswith('{') %}
          {% set text = stripped | regex_replace('(?is)^.*?(\\{)', '\\1') %}
          {% set text = text | regex_replace('(?is)(\\})[^\\}]*$', '\\1') %}
        {% elif stripped.startswith('[') %}
          {% set text = stripped | regex_replace('(?is)^.*?(\\[)', '\\1') %}
          {% set text = text | regex_replace('(?is)(\\])[^\\]]*$', '\\1') %}
        {% elif '{' in text %}
          {% set text = text | regex_replace('(?is)^.*?(\\{)', '\\1') %}
          {% set text = text | regex_replace('(?is)(\\})[^\\}]*$', '\\1') %}
        {% elif '[' in text %}
          {% set text = text | regex_replace('(?is)^.*?(\\[)', '\\1') %}
          {% set text = text | regex_replace('(?is)(\\])[^\\]]*$', '\\1') %}
        {% endif %}
        {{ text | trim }}
  - action: system_log.write
    data:
      level: info
      logger: granny_car_charge_plan
      message: >-
        AI-plan cleaned payload (preview): {{ ai_json_text | truncate(400, True, '...') }}
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ ai_raw | length > 0 }}'
      sequence: []
    default:
    - action: logbook.log
      data:
        name: '{{ log_prefix }}'
        message: 'AI svarade tomt. Avbryter.'
    - action: persistent_notification.create
      data:
        title: Ingen laddningsplan skapades
        message: 'AI svarade tomt eller utan data. Se loggboken för detaljer.'
        notification_id: granny_car_charge_plan_empty
    - stop: AI gav inget svar.
  - variables:
      plan_data_raw: '{{ ai_json_text | from_json(default=None) }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ plan_data_raw is not none }}'
      sequence: []
    default:
    - action: logbook.log
      data:
        name: '{{ log_prefix }}'
        message: 'AI-svaret kunde inte tolkas som JSON: {{ ai_json_text }}'
    - action: persistent_notification.create
      data:
        title: AI-svar saknar JSON
        message: 'AI gav svaret: {{ ai_raw }}. Förväntade giltig JSON. Kontrollera instruktionen.'
        notification_id: granny_car_charge_plan_format_error
    - action: system_log.write
      data:
        level: warning
        logger: granny_car_charge_plan
        message: 'AI-plan JSON kunde inte parsas. Rådata: {{ ai_json_text }}'
    - stop: AI gav ogiltigt format.
  - variables:
      plan_data: >-
        {% set result = {} %}
        {% if plan_data_raw is mapping %}
          {% set result = plan_data_raw %}
        {% elif plan_data_raw is iterable and plan_data_raw is not string %}
          {% set result = {'schedule': plan_data_raw} %}
        {% endif %}
        {% if plan_data_raw is string %}
          {% set parsed = plan_data_raw | from_json(default=None) %}
          {% if parsed is mapping %}
            {% set result = parsed %}
          {% elif parsed is iterable and parsed is not string %}
            {% set result = {'schedule': parsed} %}
          {% endif %}
        {% endif %}
        {{ result | tojson | from_json }}
  - variables:
      plan_schedule_raw: >-
        {% set keys = ['schedule', 'planned_schedule', 'time', 'slots', 'chargeSessions', 'sessions', 'windows'] %}
        {% set candidates = [] %}
        {% set state = namespace(found=None) %}
        {% if plan_data is mapping %}
          {% set candidates = candidates + [plan_data] %}
          {% set data_field = plan_data.get('data') %}
          {% if data_field is string %}
            {% set parsed = data_field | from_json(default={}) %}
            {% if parsed is mapping %}
              {% set candidates = candidates + [parsed] %}
            {% elif parsed is iterable and parsed is not string %}
              {% set candidates = candidates + [{'schedule': parsed}] %}
            {% endif %}
          {% elif data_field is mapping %}
            {% set candidates = candidates + [data_field] %}
          {% endif %}
          {% set result_field = plan_data.get('result') %}
          {% if result_field is string %}
            {% set parsed = result_field | from_json(default={}) %}
            {% if parsed is mapping %}
              {% set candidates = candidates + [parsed] %}
            {% elif parsed is iterable and parsed is not string %}
              {% set candidates = candidates + [{'schedule': parsed}] %}
            {% endif %}
          {% elif result_field is mapping %}
            {% set candidates = candidates + [result_field] %}
          {% endif %}
        {% elif plan_data is iterable and plan_data is not string %}
          {% set candidates = candidates + [{'schedule': plan_data}] %}
        {% endif %}
        {% for cand in candidates %}
          {% if cand is mapping %}
            {% for key in keys %}
              {% set value = cand.get(key) %}
              {% if value is not none %}
                {% set state.found = value %}
                {% break %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {% if state.found is not none %}
            {% break %}
          {% endif %}
        {% endfor %}
        {% set result = state.found %}
        {% if result is string %}
          {% set result = result | from_json(default=result) %}
        {% endif %}
        {% if result is none %}
          {{ [] }}
        {% else %}
          {{ result }}
        {% endif %}
      plan_currency: >-
        {% if plan_data is mapping %}
          {{ plan_data.get('currency', price_currency) | default(price_currency) }}
        {% else %}
          {{ price_currency }}
        {% endif %}
  - action: system_log.write
    data:
      level: info
      logger: granny_car_charge_plan
      message: 'AI-plan parsed data: {{ plan_data }}'
  - action: system_log.write
    data:
      level: info
      logger: granny_car_charge_plan
      message: 'AI-plan raw schedule: {{ plan_schedule_raw }}'
  - variables:
      plan_schedule_initial: >-
        {% set raw = plan_schedule_raw %}
        {% if raw is string %}
          {% set raw = raw | from_json(default=[]) %}
        {% endif %}
        {% if raw is mapping %}
          {% set raw = raw.get('time', raw.get('slots', raw.get('schedule', raw.get('planned_schedule', raw.get('chargeSessions', raw.get('sessions', raw.get('windows', []))))))) %}
        {% endif %}
        {% if raw is string %}
          {% set raw = raw | from_json(default=[]) %}
        {% endif %}
        {% if raw is mapping %}
          {% set raw = raw.get('time', raw.get('slots', raw.get('schedule', raw.get('planned_schedule', raw.get('chargeSessions', raw.get('sessions', raw.get('windows', []))))))) %}
        {% endif %}
        {% if raw is iterable %}
          {% set raw_list = raw | list %}
        {% else %}
          {% set raw_list = [] %}
        {% endif %}
        {% set normalized = namespace(items=[]) %}
        {% for slot in raw_list %}
          {% set item = slot %}
          {% if item is string %}
            {% set item = item | from_json(default={}) %}
          {% endif %}
          {% if item is mapping %}
            {% set interval = item.get('time_interval') %}
            {% set start = item.get('start') %}
            {% set end = item.get('end') %}
            {% if interval %}
              {% set start = start or interval.get('start') %}
              {% set end = end or interval.get('end') %}
            {% endif %}
            {% set start = start or item.get('startTime') or item.get('start_time') or item.get('timeStart') or item.get('time_start') or item.get('slot_start_time') or item.get('slot_start') %}
            {% set end = end or item.get('endTime') or item.get('end_time') or item.get('timeEnd') or item.get('time_end') or item.get('timeStop') or item.get('slot_end_time') or item.get('slot_end') %}
            {% if start %}
              {% if start | string | length == 15 and 'T' not in start %}
                {% set start = start | replace(' ', 'T') %}
              {% endif %}

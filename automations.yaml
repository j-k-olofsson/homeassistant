- id: '1676995549797'
  alias: SCEN - Godnatt
  description: Stänger av lampor och ger en godnatt-hälsning. Kontrollerar även om
    balkongdörren är stängd.
  triggers:
  - entity_id:
    - input_button.godnatt
    trigger: state
  conditions: []
  actions:
  - variables:
      _door_open: '{{ is_state(''binary_sensor.shelly_blu_door_window_2a6d_window'',
        ''on'') }}'
      _godnatt_task: "{% if _door_open %}\n  Balkongdörren är öppen. Varningston men
        varm Granny-stil. Exakt en mening på svenska, 8-14 ord, inga siffror.\n{%
        else %}\n  Säg godnatt och bekräfta tryggt läge med varm Granny-stil. Exakt
        en mening på svenska, 8-14 ord, inga siffror.\n{% endif %}\n"
      _godnatt_fallback: "{% if _door_open %}\n  Balkongdörren är öppen. Kolla den
        innan ni somnar.\n{% else %}\n  Allt ser tryggt ut. Sov gott.\n{% endif %}\n"
  - parallel:
    - sequence:
      - action: media_player.turn_on
        continue_on_error: true
        target:
          entity_id: media_player.diegos_vackarklocka
      - delay: 00:00:01
      - action: script.granny_broadcast
        data:
          task: '{{ _godnatt_task }}'
          severity: '{{ ''warn'' if _door_open else ''info'' }}'
          humor_level: '{{ 0 if _door_open else 1 }}'
          tts_media_player: media_player.diegos_vackarklocka
          channels:
          - tts
          fallback_message: '{{ _godnatt_fallback }}'
    - sequence:
      - target:
          entity_id: light.grupp_godnatt
        action: light.turn_off
        data: {}
        enabled: true
      - type: turn_off
        device_id: 729cf1c0d534488f8fbbe60601af82af
        entity_id: 50f5f890647aa525eea1ae293f9a82bc
        domain: switch
        enabled: true
      - type: turn_off
        device_id: 729cf1c0d534488f8fbbe60601af82af
        entity_id: a70d7a6b06c541b3f592ded441c98a1a
        domain: switch
      - action: spotifyplus.player_media_pause
        metadata: {}
        data:
          entity_id: media_player.spotifyplus_mammaochpapppa
        enabled: true
  mode: single
- id: '1678110729020'

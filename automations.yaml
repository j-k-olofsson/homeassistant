- id: '1674139073169'
  alias: Hissmusik
  description: Spela hissmusik på morgonen eller när knappen trycks in. Automationen
    startar en Spotify-spellista med godtycklig och blandad musik för en glad start
    på dagen.
  triggers:
  - entity_id:
    - input_button.spela_hissmusik
    trigger: state
    id: google-voice
  - trigger: time
    at: 05:30:00
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
    id: 0530-weekdays
  - trigger: time
    at: 07:00:00
    weekday:
    - sat
    - sun
    id: 0700-weekends
  - trigger: time
    at: 08:00:00
    id: 0900-alldays
  - trigger: time
    at: '20:00:00'
    id: 2000-alldays
  - trigger: time
    at: '22:00:00'
    id: 2200-alldays
  conditions: []
  variables:
    spotify_target_device_id: Dassens högtalare
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - 0530-weekdays
        - 0700-weekends
        - 2000-alldays
      sequence:
      - alias: Väck 502e110e3653a9ec3bade927714d8bbc
        continue_on_error: true
        action: media_player.play_media
        target:
          entity_id: media_player.spotifyplus_mammaochpapppa
        data:
          media:
            media_content_id: https://actions.google.com/sounds/v1/alarms/beep_short.ogg
            media_content_type: music
            metadata: {}
      - alias: Spela hissmusik (retry x3)
        repeat:
          count: 3
          sequence:
          - action: spotifyplus.player_media_play_context
            continue_on_error: true
            data:
              entity_id: media_player.spotifyplus_mammaochpapppa
              context_uri: spotify:playlist:1NL3k4V4XXj4mOOr2e6JGQ
              device_id: '{{ spotify_target_device_id }}'
              shuffle: true
          - delay: 00:00:03
          - choose:
            - conditions:
              - condition: state
                entity_id: media_player.spotifyplus_mammaochpapppa
                state: playing
              sequence: []
            default: []
      - choose:
        - conditions:
          - condition: state
            entity_id: media_player.spotifyplus_mammaochpapppa
            state: playing
          sequence:
          - action: spotifyplus.player_set_repeat_mode
            data:
              entity_id: media_player.spotifyplus_mammaochpapppa
              state: context
        default: []
    - conditions:
      - condition: trigger
        id:
        - 0900-alldays
        - google-voice
      sequence:
      - action: spotifyplus.player_media_play_context
        data:
          entity_id: media_player.spotifyplus_mammaochpapppa
          context_uri: spotify:playlist:2fLpo9cVywf8wM52GesCKz?si=3YTiMKqfSMmiJYh5XXwYVw
          device_id: '{{ spotify_target_device_id }}'
          shuffle: true
      - action: spotifyplus.player_set_repeat_mode
        data:
          entity_id: media_player.spotifyplus_mammaochpapppa
          state: context
    - conditions:
      - condition: trigger
        id:
        - 2200-alldays
      sequence:
      - action: spotifyplus.player_media_pause
        data:
          entity_id: media_player.spotifyplus_mammaochpapppa
          device_id: '{{ spotify_target_device_id }}'
  mode: queued
  max: 10

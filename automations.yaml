  - trigger: state
    entity_id: input_select.light_scene
    to: NIGHT
    id: scene_night
  - trigger: state
    entity_id: input_select.light_scene
    to: DAY
    id: scene_day
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: scene_dusk
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.bordslampa_ateljen
        data:
          color_temp_kelvin: '{{ state_attr(''light.bordslampa_ateljen'', ''min_color_temp_kelvin'')
            or 2000 }}'
          brightness_pct: 50
          transition: 1
    - conditions:
      - condition: trigger
        id: scene_night
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.bordslampa_ateljen
        data:
          color_temp_kelvin: '{{ state_attr(''light.bordslampa_ateljen'', ''min_color_temp_kelvin'')
            or 2000 }}'
          brightness_pct: 5
          transition: 1
    - conditions:
      - condition: trigger

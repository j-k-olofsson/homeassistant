                    ''min_color_temp_kelvin'') or 2000 }}'
                  brightness_pct: '{{ bri }}'
                  transition: 30
              - delay: 00:00:30
          - action: light.turn_on
            target:
              entity_id: light.bordslampa_ateljen
            data:
              color_temp_kelvin: '{{ state_attr(''light.bordslampa_ateljen'', ''min_color_temp_kelvin'')
                or 2000 }}'
              brightness_pct: 50
              transition: 30
        default:
        - action: light.turn_on
          target:
            entity_id: light.bordslampa_ateljen
          data:
            color_temp_kelvin: '{{ state_attr(''light.bordslampa_ateljen'', ''min_color_temp_kelvin'')
              or 2000 }}'
            brightness_pct: 50
            transition: 1
    default: []

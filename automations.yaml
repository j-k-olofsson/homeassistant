        id: dusk
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.sun_phase
        data:
          option: SUNPHASE_SUNSET
    - conditions:
      - condition: trigger
        id: night
      sequence:
      - action: input_select.select_option
        target:

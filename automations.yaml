- id: '1680086760563'
  alias: Nya elpriser har publicerats
  description: Denna automation meddelar dig när elpriserna för nästa dygn blir tillgängliga.
    Den skickar notifikationer via mobil och spelar upp ett meddelande genom högtalaren.
  triggers:
  - entity_id:
    - sensor.nordpool
    attribute: tomorrow_valid
    to: 1
    trigger: state
  conditions: []
  actions:
  - action: script.granny_broadcast
    metadata: {}
    data:
      severity: info
      humor_level: 1
      task: "SYSTEM Du är \"Granny\", en varm och vardaglig hushållsrådgivare som
        pratar till familjen i hemmet. Du ska låta personlig, kortfattad och lättsam,
        inte som en teknisk rapport. Svara på svenska med naturligt språk, utan siffror
        eller tabeller.\n\n  USER Nedanstående data är elpris per timme för NÄSTA
        DYGN i SE3. Varje rad är: YYYY-MM-DDTHH:00±ZZZZ=pris;kategori\n  Kategorier:\n
        \   - green: < 1,65 SEK/kWh\n    - yellow: 1,66–3,00 SEK/kWh\n    - red: >
        3,00 SEK/kWh\n\n  Uppgift:\n    1) Analysera prisnivåerna och avgör om morgondagen
        ser billig, normal eller dyr ut som helhet.\n    2) Om det finns tydliga undantag
        (t.ex. dyrare morgon eller kväll) nämn dem kort.\n    3) Skriv ett vänligt
        och mänskligt meddelande som passar att läsas upp av Granny, t.ex.:\n       -
        “Morgondagens elpriser ser fina ut, mest gröna nivåer hela dagen.”\n       -
        “Det ser ut att bli dyrt imorgon, särskilt på morgonen och kvällen.”\n    4)
        Undvik siffror och tekniska detaljer. Fokusera på hur hushållet kan tänka
        kring sin vardag (tvätt, laddning, matlagning).\n    5) Max 25 ord, ingen
        punktlista. Bara ett kort och naturligt stycke text.\n\n  DATA\n{# ===== PROD:
        nästa dygn när tomorrow_valid: true ===== #}\n{%- set e = 'sensor.nordpool'
        -%}\n{%- set currency = state_attr(e,'currency') or 'SEK' -%}\n{%- set unit
        = currency ~ '/kWh' -%}\n{%- set area = state_attr(e,'region') or state_attr(e,'area')
        or 'SE?' -%}\n{%- set nowts = now() -%}\n{%- set base_today = today_at() -%}\n{%-
        set base_tomorrow = base_today + timedelta(days=1) -%}\n{%- set tm  = state_attr(e,'tomorrow')
        \    | default([], true) -%}\n{%- set rtm = state_attr(e,'raw_tomorrow') |
        default([], true) -%}\n\n{%- macro cat(v) -%}\n  {%- set x = (v|float) -%}\n
        \ {%- if x > 3 -%}red{%- elif x >= 1.66 -%}yellow{%- else -%}green{%- endif
        -%}\n{%- endmacro -%}\n\n# PRICES\ntz={{ now().tzinfo }}\narea={{ area }}\ncurrency={{
        currency }}\nunit={{ unit }}\nvat={{ state_attr(e,'vat') if state_attr(e,'vat')
        is not none else 'unknown' }}\nsource=nordpool\ngenerated={{ as_local(nowts).strftime('%Y-%m-%dT%H:%M%z')
        }}\n\n# DATA (start_hour=value;cat)\n{%- if not state_attr(e,'tomorrow_valid')
        -%}\nNO DATA: tomorrow_valid=false\n{%- elif tm|length == 24 -%}\n{%- for
        i in range(0,24) -%}\n{{ as_local(base_tomorrow + timedelta(hours=i)).strftime('%Y-%m-%dT%H:00%z')
        }}={{ (tm[i]|float)|round(3) }};{{ cat(tm[i]) }}\n{%- endfor -%}\n{%- elif
        tm|length == 96 -%}\n{%- for i in range(0,24) -%}\n{%- set j = i*4 -%}\n{%-
        set v = ((tm[j]|float)+(tm[j+1]|float)+(tm[j+2]|float)+(tm[j+3]|float))/4
        -%}\n{{ as_local(base_tomorrow + timedelta(hours=i)).strftime('%Y-%m-%dT%H:00%z')
        }}={{ v|round(3) }};{{ cat(v) }}\n{%- endfor -%}\n{%- elif rtm|length > 0
        -%}\n{%- for i in range(0,24) -%}\n{%- set h_start = base_tomorrow + timedelta(hours=i)
        -%}\n{%- set h_end   = h_start + timedelta(hours=1) -%}\n{%- set sumv = 0.0
        -%}{%- set cnt = 0 -%}\n{%- for q in rtm -%}\n{%- set qs = as_datetime(q['start'])
        -%}\n{%- if qs >= h_start and qs < h_end -%}\n{%- set sumv = sumv + (q['value']|float)
        -%}\n{%- set cnt = cnt + 1 -%}\n{%- endif -%}\n{%- endfor -%}\n{%- if cnt
        > 0 -%}\n{%- set v = (sumv / cnt) -%}\n{{ as_local(h_start).strftime('%Y-%m-%dT%H:00%z')
        }}={{ v|round(3) }};{{ cat(v) }}\n{%- endif -%}\n{%- endfor -%}\n{%- endif
        -%}\n"
      channels:
      - tts
      - mobile
      - slack
      tts_media_player: media_player.grannys_hogtalare
      slack_channel: '#elpriser'
  mode: queued
  max: 10

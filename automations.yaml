- id: '1751524387243'
  alias: Starta Granny Bil-laddning
  description: Startar AI-planeringen av bilens laddning och överlåter schemaläggningen
    till skriptet granny_car_charge_plan.
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id:
    - sensor.nordpool
    attribute: tomorrow_valid
    to: 1
  - trigger: state
    entity_id:
    - device_tracker.sef_42h_parking_location
    to: home
    for:
      hours: 0
      minutes: 5
      seconds: 0
  - trigger: template
    value_template: "{{ states('sensor.sef_42h_battery_level') | float(999) <\n   states('input_number.car_target_soc')
      | float(999) }}\n"
    for:
      hours: 0
      minutes: 5
      seconds: 0
  conditions:
  - condition: template
    value_template: '{% set loc = states(''device_tracker.sef_42h_parking_location'')
      %} {{ loc in [''home'', ''Hemma''] }}

      '
  - condition: state
    entity_id: input_boolean.car_ai_planning_enabled
    state: 'on'
  - condition: state
    entity_id: input_boolean.car_man_override
    state: 'off'
  - condition: template
    value_template: "{{ states('sensor.sef_42h_battery_level') | float(0) <\n   states('input_number.car_target_soc')
      | float(100) }}\n"
  - condition: state
    entity_id: input_boolean.ha_ready
    state: 'on'
  actions:
  - action: persistent_notification.create
    data:
      title: Granny-planering
      message: 'Automationen startades {{ now().strftime(''%d %b %H:%M'') }} via {{
        trigger.description | default(trigger.id | default(trigger.platform | default(''ok'')))
        }}. Batteri: {{ states(''sensor.sef_42h_battery_level'') }} %, mål: {{ states(''input_number.car_target_soc'')
        }} %.'
      notification_id: granny_plan_status
  - variables:
      granny_window_end_iso: '{% set window_start = now() %} {% set deadline = today_at(''05:30:00'')
        %} {% set window_end = deadline if window_start < deadline else (deadline
        + timedelta(days=1)) %} {{ window_end.isoformat() }}'
      granny_tomorrow_valid: '{{ state_attr(''sensor.nordpool'', ''tomorrow_valid'')
        in [True, 1, ''true''] }}'
      granny_price_slots: "{% set sensor = 'sensor.nordpool' %} {% set raw_today =
        state_attr(sensor, 'raw_today') or [] %} {% set raw_tomorrow = state_attr(sensor,
        'raw_tomorrow') or [] %} {% set window_start = now() %} {% set deadline =
        today_at('05:30:00') %} {% set window_end = deadline if window_start < deadline
        else (deadline + timedelta(days=1)) %} {% set slots = namespace(count=0) %}
        {% for item in raw_today + raw_tomorrow %}\n  {% if item is mapping %}\n    {%
        set start = item.get('start') %}\n    {% set end = item.get('end') %}\n  {%
        else %}\n    {% set start = item[0] %}\n    {% set end = item[1] %}\n  {%
        endif %}\n  {% set start_dt = as_datetime(start) if start is not none else
        none %}\n  {% set end_dt = as_datetime(end) if end is not none else none %}\n
        \ {% if start_dt is none or end_dt is none %}\n    {% continue %}\n  {% endif
        %}\n  {% if end_dt > window_start and start_dt < window_end %}\n    {% set
        slots.count = slots.count + 1 %}\n  {% endif %}\n{% endfor %} {{ slots.count
        }}"
      granny_calendar_entity: calendar.billaddning
      granny_calendar_next_start: '{{ state_attr(granny_calendar_entity, ''start_time'')
        }}'
      granny_calendar_has_plan: '{{ granny_calendar_next_start not in [None, '''',
        ''unknown'', ''unavailable''] }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not granny_tomorrow_valid }}'
      sequence:
      - action: logbook.log
        data:
          name: '[Granny AI-Laddning]'
          message: 'Planeringen stoppad: tomorrow_valid är False. Trigger: {{ trigger.description
            | default(trigger.id | default(trigger.platform | default("ok"))) }}.'
      - action: persistent_notification.create
        data:
          title: Granny-planering väntar
          message: Morgondagens elpriser är ännu inte bekräftade. Väntar på att sensor.nordpool:s
            attribut tomorrow_valid ska bli sant innan planen tas fram.
          notification_id: granny_plan_status
      - stop: Väntar på morgondagens priser.
    - conditions:
      - condition: template
        value_template: '{{ granny_price_slots | int(0) == 0 }}'
      sequence:
      - action: logbook.log
        data:
          name: '[Granny AI-Laddning]'
          message: 'Planeringen stoppad: inga prisintervall överlappar fönstret. Trigger:
            {{ trigger.description | default(trigger.id | default(trigger.platform
            | default("ok"))) }}.'
      - action: persistent_notification.create
        data:
          title: Granny-planering väntar
          message: Inga prisintervall täcker fönstret fram till {{ as_local(as_datetime(granny_window_end_iso)).strftime('%d
            %b %H:%M') }}. Automationen avvaktar nya elpriser innan plan tas fram.
          notification_id: granny_plan_status
      - stop: Väntar på prisdata.
    - conditions:
      - condition: template
        value_template: '{{ granny_calendar_has_plan }}'
      sequence:
      - action: logbook.log
        data:
          name: '[Granny AI-Laddning]'
          message: Planeringen hoppades över eftersom kalendern redan innehåller en
            laddningsplan som startar {{ as_local(as_datetime(granny_calendar_next_start)).strftime('%d
            %b %H:%M') if granny_calendar_next_start not in [None, '', 'unknown',
            'unavailable'] else 'inom fönstret' }}.
      - action: persistent_notification.create
        data:
          title: Laddningsplan finns redan
          message: Det finns redan en aktiv laddningsplan i kalendern. Rensa eller
            justera kalendern manuellt för att skapa en ny plan.
          notification_id: granny_plan_status
      - stop: Laddningsplan finns redan.
  - action: script.granny_car_charge_plan
    metadata: {}
    data: {}
  mode: restart
- id: '1751907475273'
